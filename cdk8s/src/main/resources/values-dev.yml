replicas: 1

app:
  id: fybros-kutumb-web

port: 80
containerPort: 80
image: docker.carvia.tech/kube-repo/fybros-kutumb-web
pullPolicy: IfNotPresent

livenessProbe:
  path: /
  port: 80
  initialDelay: 30
  period: 120

readinessProbe:
  path: /
  port: 80
  initialDelay: 20
  period: 30

env:
  - name: NGINX_WORKER_PROCESSES
    value: 1

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"

ingress:
  - ingressName: fybros-kutumb-web-ingress
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/add-base-url: true
      nginx.ingress.kubernetes.io/ssl-redirect: true
    ingressTls:
      - host: kutumb.carvia-test.org
        secretName: carvia-candidates-web-tls
    ingressRules:
      - host: kutumb.carvia-test.org
        pathPrefix: /
        pathType: ImplementationSpecific
