name: Release macOS Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Sync version into tauri.conf.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Build frontend
        run: npm run build:prod

      - name: Build Tauri app (universal)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Locate build artifact
        id: artifact
        run: |
          TARBALL=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz")
          echo "TARBALL_PATH=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "TARBALL_NAME=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ steps.artifact.outputs.TARBALL_NAME }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Automated release $TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "", "url": "$URL" },
              "darwin-x86_64": { "signature": "", "url": "$URL" }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.TARBALL_PATH }}
            latest.json